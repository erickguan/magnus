---
name: jiff-magnus release

"on":
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: jiff-magnus-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jiff-magnus
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: jiff-magnus
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> jiff-magnus/tmp/jiff_magnus/target
      - name: Lint, test, and verify source gem installation
        run: bundle exec rake release:check
      - name: Sign the source gem with the workflow identity
        run: >-
          gem exec sigstore-cli:0.2.3 sign pkg/*.gem
          --bundle pkg/jiff-magnus.sigstore.json
      - uses: rubygems/configure-rubygems-credentials@v2.1.0
        with:
          trusted-publisher: true
      - name: Publish the source gem with its attestation
        run: >-
          gem push pkg/*.gem --host https://rubygems.org
          --attestation pkg/jiff-magnus.sigstore.json
