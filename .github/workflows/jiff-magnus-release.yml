---
name: jiff-magnus release

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jiff-magnus-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jiff-magnus
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: jiff-magnus
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> jiff-magnus/tmp/jiff_magnus/target
      - name: Lint, test, and verify source gem installation
        run: bundle exec rake release:check
      - name: Publish the source gem
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          if [ -z "$GEM_HOST_API_KEY" ]; then
            echo "Set the RUBYGEMS_API_KEY repository secret before releasing."
            exit 1
          fi
          gem push pkg/*.gem
