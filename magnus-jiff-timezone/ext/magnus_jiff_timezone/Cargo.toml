[package]
name = "magnus-jiff-timezone-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

# Installed gems build independently of the parent Magnus workspace.
[workspace]

[lib]
name = "magnus_jiff_timezone"
crate-type = ["cdylib"]

[dependencies]
jiff = { version = "0.2.35", default-features = false, features = ["std", "tzdb-bundle-always"] }
# Magnus 0.10 is unreleased. Pin the portable timezone ABI implementation rather
# than relying on the parent checkout or a moving branch during gem installation.
magnus = { git = "https://github.com/erickguan/magnus", rev = "f9b812b4c61e0cce8bc9ebd226cabc77b6b95f1e", default-features = false, features = ["jiff-zoned", "rb-sys"] }
rb-sys = { version = "0.9.124", default-features = false, features = ["stable-api-compiled-fallback"] }
